<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <h:outputStylesheet name="/css/default.css"/>
        <h:outputStylesheet name="/css/cssLayout.css"/>
        <title>JSF/Converter - 29/10/25</title>
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" />
        <div id="top">
            <ui:insert name="top">

                <h:form>
                    <p:menubar style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

                        <!-- 🧭 Parte esquerda do menu -->
                        <p:menuitem value="Home" outcome="/index" />
                        <p:submenu label="Navegação">
                            <p:menuitem value="Pessoa" outcome="/pessoa/lista" />
                            <p:menuitem value="Manutenção" outcome="/manutencao/lista_manutencao" />
                        </p:submenu>
                        <p:menuitem value="Login" outcome="/login/login" />

                        <!-- 👤 Parte direita: informações do usuário -->
                        <h:panelGroup layout="block" style="margin-right: 1rem;">
                            <h:outputText value="Usuário: " style="font-weight: bold; color: #666;" />
                            <h:outputText value="#{loginController.pessoaLogada.nome}" style="color: #000;" />
                     
                            <p:commandButton value="Sair"
                                             action="#{loginController.logout}"
                                             ajax="false"
                                             styleClass="ui-button-danger"
                                             style="margin-left: 10px;" />
                        </h:panelGroup>

                    </p:menubar>
                </h:form>

            </ui:insert>
        </div>

        <div id="content" class="center_content">
            <ui:insert name="content">
                Conteudo do template
            </ui:insert>
        </div>

        <div id="bottom">
            <ui:insert name="bottom">
                Rodape
            </ui:insert>
        </div>

    </h:body>

</html>
