<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="primefaces"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Luana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    <h:body style="background-color: lemonchiffon">
        
        <div><h1><font color= "black">Página inicial legal</font></h1></div>
        <h:form>
            
                    <p:commandButton value="Inserir Pessoa" 
                         action="#{pessoaController.inserir()}"
                         style="background-color: crimson"
                    />
                
                    <p/> 
                    
                    <p:commandButton value="Inserir Veiculo" 
                         action="#{pessoaController.inserirVeiculos()}"

                    />
               
                    <p/> 
                    
                    <p:commandButton value="Inserir Categoria" 
                         action="#{pessoaController.inserirCategoria()}"
                         style="background-color: plum"
                         
                    />
                    
                    <p/> 
                    
                    <p:commandButton value="Inserir Produto" 
                         action="#{pessoaController.inserirProduto()}"
                         style="background-color: mediumvioletred"
                         
                    />
                    
                    <p/> 
                    
                    <p:commandButton value="Inserir Produto2" 
                         action="#{pessoaController.inserirProduto2()}"

                    />
                  
                    <p/> 
                    
                    <p:commandButton value="Alterar Categoria" 
                         action="#{pessoaController.alterarCategoria()}"

                    />
