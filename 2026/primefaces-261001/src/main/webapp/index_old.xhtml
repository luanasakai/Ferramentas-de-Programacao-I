<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
    </h:head>

    <h:body>
        <h:form>

            <p:menubar>
                <p:menuitem value="Home" outcome="/index" />
                
                <p:submenu label="Cadastros">
                    <p:menuitem value="Pessoa" outcome="/pessoa/cadastrar" />
                </p:submenu>
                
            </p:menubar>



            <p:inputText value="#{homeController.nome}" />

            <p:commandButton 
                value="Exibir"
                action="#{homeController.exibir()}"
                />

            <br />

            <p:inputText id="contador" value="#{homeController.contador}" />

            <p:commandButton
                update="contador"
                value="Incrementar"
                action="#{homeController.incrementar()}"
                />

        </h:form>

    </h:body>
</html>
