<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template.xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                xmlns:f="jakarta.faces.core">

    <ui:define name="content">

        <h:form id="form" class="align-center">
            <p:panelGrid columns="2" layout="tabular" style="width: 100%" >
                <f:facet name="header">
                    Login
                </f:facet>
                <p:outputLabel value="Login"/>
                <p:inputText value="#{loginController.login.login}" />

                 <p:outputLabel for="@next" value="Senha"/>
                 <p:password id="toggle" 
                             value="#{loginController.login.senha}" 
                             toggleMask="true" 
                             redisplay="true"
                             promptLabel="Digite a senha"
                             />
            </p:panelGrid>

            <p:commandButton value="Acessar"
                             update="form growl"
                             ajax="false" 
                             action="#{loginController.acessar}" />

        </h:form>
    </ui:define>
</ui:composition>
